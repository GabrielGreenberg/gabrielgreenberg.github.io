<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GQ900QDSEE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GQ900QDSEE');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognition &amp; Computation (2026)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            font-size: 16px;
            line-height: 26px;
            color: #3f3f3f;
        }
        a {
            color: #1382d6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* ============ BANNER ============ */
        .banner {
            background: url(images/sun-banner.jpg) no-repeat;
            background-position: top center;
            background-size: 100% auto;
            min-height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .banner h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 72px;
            letter-spacing: 1px;
            color: #f5f5f5;
            text-align: center;
            margin: 0;
            line-height: 1.1;
        }

        /* ============ ANNOUNCEMENTS BAR ============ */
        .announcements {
            display: none;               /* shown by the script when there are items */
            background: #111;
            color: #d9d9d9;
        }
        .announcements.has-items {
            display: block;
        }
        .announcements-inner {
            max-width: 1140px;
            margin: 0 auto;
            padding: 30px 15px 32px 15px;
        }
        .announcements-label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #f2712b;
            line-height: 26px;
            padding-top: 1px;
        }
        .announcement + .announcement {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
        }
        .announcement-head {
            font-weight: 700;
            color: #fff;
        }
        .announcement-date {
            font-weight: 400;
            color: #9a9a9a;
            margin-right: 10px;
        }
        .announcement-body {
            margin: 4px 0 0 0;
        }
        .announcements a {
            color: #ffb27a;
        }

        /* ============ CONTENT ============ */
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 50px 15px 70px 15px;
        }
        .row {
            display: flex;
            gap: 30px;
        }
        .col-left {
            width: 28.8%;
            flex-shrink: 0;
        }
        .col-right {
            flex: 1;
            min-width: 0;
        }
        .section-label {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            color: #3f3f3f;
        }
        .styled-hr {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.13);
            margin: 35px 0;
        }
        .session-title {
            font-weight: 700;
            color: #3f3f3f;
        }
        .session-date {
            color: rgb(36, 103, 141);
        }
        .handout a {
            font-weight: 700;
        }
        .reading-label {
            font-weight: 700;
            margin-top: 20px;
        }
        .reading-label:first-child {
            margin-top: 0;
        }
        .col-right p {
            margin: 0 0 10px 0;
        }
        .col-right p:last-child {
            margin-bottom: 0;
        }
        ul.readings {
            margin: 5px 0 0 0;
            padding-left: 28px;
        }
        ul.readings li {
            margin-bottom: 2px;
        }
        .reading-tag {
            color: #999;
            font-size: 15px;
        }
        .session-note {
            margin-top: 18px;
            font-size: 15px;
            line-height: 24px;
            color: #8a8a8a;
            font-style: italic;
        }
        .session-due {
            margin-top: 14px;
            font-weight: 700;
            color: #c24e14;
        }
        .session-due div + div {
            margin-top: 2px;
        }

        /* ============ REQUIREMENTS / ASSIGNMENTS / POLICIES ============ */
        .req-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .req-list li {
            display: flex;
            gap: 18px;
            margin-bottom: 4px;
        }
        .req-due {
            flex: 0 0 110px;
            color: rgb(36, 103, 141);
        }
        .req-footnote {
            margin-top: 14px !important;
            font-size: 15px;
            color: #6f6f6f;
        }
        .assignment {
            scroll-margin-top: 20px;
        }
        .assignment + .assignment {
            margin-top: 26px;
        }
        .assignment-head {
            margin-bottom: 6px;
        }
        .assignment-title {
            font-weight: 700;
        }
        .assignment-due {
            color: rgb(36, 103, 141);
            margin-left: 10px;
        }
        .col-right p.assignment-field {
            margin: 0 0 4px 0;
        }
        .assignments-note {
            margin-bottom: 26px !important;
        }
        .policy + .policy {
            margin-top: 12px;
        }
        .policy-label {
            font-weight: 700;
        }
        #writing-assignments, #policies {
            scroll-margin-top: 20px;
        }

        /* ============ RESPONSIVE ============ */
        @media screen and (max-width: 900px) {
            .banner h1 {
                font-size: 48px;
            }
        }
        @media screen and (max-width: 768px) {
            .banner {
                min-height: 240px;
            }
            .banner h1 {
                font-size: 36px;
            }
            .container {
                padding: 30px 15px 50px 15px;
            }
            .announcements-inner {
                padding: 22px 15px 26px 15px;
            }
            .row {
                flex-direction: column;
                gap: 12px;
            }
            .col-left {
                width: 100%;
            }
            .section-label {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <header class="banner">
        <h1 id="banner-title">Cognition &amp; Computation</h1>
    </header>

    <section class="announcements" id="announcements">
        <!-- Rendered from the "announcements" list in cognition-computation-2026.json -->
    </section>

    <div class="container" id="course-container">
        <!-- Content rendered from cognition-computation-2026.json -->
    </div>

    <script>
        fetch('cognition-computation-2026.json')
            .then(response => response.json())
            .then(data => renderCourse(data))
            .catch(error => {
                console.error('Error loading course data:', error);
                document.getElementById('course-container').innerHTML =
                    '<p>Error loading course data.</p>';
            });

        function renderReading(reading) {
            // Either a pre-formatted html string, or structured fields
            if (reading.html) {
                return `<li>${reading.html}</li>`;
            }
            let citation = '';
            if (reading.author) {
                citation += reading.author;
            }
            if (reading.year) {
                citation += ` (${reading.year})`;
            }
            let title = reading.title || '';
            if (reading.style === 'quotes') {
                title = `&ldquo;${title}&rdquo;`;
            } else if (title) {
                title = `<em>${title}</em>`;
            }
            if (reading.url && title) {
                title = `<a href="${reading.url}">${title}</a>`;
            }
            let entry = `${citation} ${title}`;
            if (reading.detail) {
                entry += reading.detail;
            }
            return `<li>${entry}</li>`;
        }

        function renderReadingGroup(readings, tag, label) {
            const group = readings.filter(r => (r.tag || 'main') === tag);
            if (group.length === 0) return '';
            let html = `<div class="reading-label">${label}:</div>`;
            html += '<ul class="readings">';
            group.forEach(r => { html += renderReading(r); });
            html += '</ul>';
            return html;
        }

        function renderCourse(data) {
            const c = data.course;
            let html = '';

            // ============ ANNOUNCEMENTS (full-width bar under the banner) ============
            const bar = document.getElementById('announcements');
            if (data.announcements && data.announcements.length > 0) {
                let ann = '<div class="announcements-inner"><div class="row">';
                ann += '<div class="col-left"><div class="announcements-label">Announcements</div></div>';
                ann += '<div class="col-right">';
                data.announcements.forEach(a => {
                    ann += '<div class="announcement">';
                    if (a.date || a.title) {
                        ann += '<div class="announcement-head">';
                        if (a.date) ann += `<span class="announcement-date">${a.date}</span>`;
                        if (a.title) ann += a.title;
                        ann += '</div>';
                    }
                    if (a.html) ann += `<p class="announcement-body">${a.html}</p>`;
                    ann += '</div>';
                });
                ann += '</div></div></div>';
                bar.innerHTML = ann;
                bar.classList.add('has-items');
            } else {
                bar.innerHTML = '';
                bar.classList.remove('has-items');
            }

            // ============ ABOUT ============
            html += '<div class="row">';
            html += '<div class="col-left"><div class="section-label">ABOUT</div></div>';
            html += '<div class="col-right"><p>';
            html += `${c.instructor}<br>`;
            html += `${c.listing} &bull; ${c.term} &bull; ${c.institution}<br>`;
            const aboutLines = [];
            if (c.when) aboutLines.push(`<strong>When:</strong> ${c.when}`);
            if (c.where) aboutLines.push(`<strong>Where:</strong> ${c.where}`);
            if (c.officeHours) aboutLines.push(`<strong>Office hours:</strong> ${c.officeHours}`);
            if (c.email) aboutLines.push(`<strong>Email:</strong> <a href="mailto:${c.email}">${c.email}</a>`);
            html += aboutLines.join('<br>');
            html += '</p></div>';
            html += '</div>';

            html += '<hr class="styled-hr">';

            // ============ SYLLABUS ============
            html += '<div class="row">';
            html += '<div class="col-left"><div class="section-label">SYLLABUS</div></div>';
            html += '<div class="col-right">';
            if (c.syllabusUrl) {
                html += `<p><a href="${c.syllabusUrl}">Syllabus</a></p>`;
            }
            html += `<p${c.syllabusUrl ? ' style="margin-top: 20px;"' : ''}><strong>Course description:</strong> ${c.description}</p>`;
            html += '</div>';
            html += '</div>';

            // ============ REQUIREMENTS (dated list; links to descriptions below) ============
            if (data.requirements && data.requirements.length > 0) {
                html += '<hr class="styled-hr">';
                html += '<div class="row">';
                html += '<div class="col-left"><div class="section-label">REQUIREMENTS</div></div>';
                html += '<div class="col-right">';
                html += '<ul class="req-list">';
                data.requirements.forEach(r => {
                    const label = r.anchor ? `<a href="#${r.anchor}">${r.label}</a>` : r.label;
                    html += `<li><span class="req-due">${r.due || ''}</span><span>${label}</span></li>`;
                });
                html += '</ul>';
                const links = [];
                if (data.assignments) links.push('<a href="#writing-assignments">writing assignments</a>');
                if (data.policies && data.policies.length > 0) links.push('<a href="#policies">course policies</a>');
                if (links.length) {
                    html += `<p class="req-footnote">See ${links.join(' and ')} below the schedule.</p>`;
                }
                html += '</div>';
                html += '</div>';
            }

            // ============ SESSIONS ============
            data.sessions.forEach(session => {
                html += '<hr class="styled-hr">';
                html += '<div class="row">';
                html += '<div class="col-left">';
                html += `<div class="session-title">${session.number}. ${session.title}</div>`;
                if (session.date) {
                    html += `<div class="session-date">${session.date}</div>`;
                }
                html += '</div>';
                html += '<div class="col-right">';
                if (session.handouts && session.handouts.length > 0) {
                    html += '<div class="handout">';
                    html += session.handouts
                        .map(h => `<a href="${h.url}">${h.label || 'Handout'}</a>`)
                        .join('<br>');
                    html += '</div>';
                }
                if (session.readings && session.readings.length > 0) {
                    html += renderReadingGroup(session.readings, 'main', session.readingsLabel || 'Reading');
                    html += renderReadingGroup(session.readings, 'recommended', 'Recommended');
                    html += renderReadingGroup(session.readings, 'optional', 'Optional');
                }
                if (session.due && session.due.length > 0) {
                    html += '<div class="session-due">';
                    html += session.due.map(d => `<div>${d}</div>`).join('');
                    html += '</div>';
                }
                if (session.note) {
                    html += `<div class="session-note">Note: ${session.note}</div>`;
                }
                html += '</div>';
                html += '</div>';
            });

            // ============ WRITING ASSIGNMENTS ============
            const asg = data.assignments;
            if (asg && asg.items && asg.items.length > 0) {
                html += '<hr class="styled-hr">';
                html += '<div class="row" id="writing-assignments">';
                html += '<div class="col-left"><div class="section-label">WRITING ASSIGNMENTS</div></div>';
                html += '<div class="col-right">';
                if (asg.note) html += `<p class="assignments-note">${asg.note}</p>`;
                asg.items.forEach(a => {
                    html += `<div class="assignment"${a.id ? ` id="${a.id}"` : ''}>`;
                    html += '<div class="assignment-head">';
                    html += `<span class="assignment-title">${a.title}</span>`;
                    if (a.due) html += `<span class="assignment-due">${a.due}</span>`;
                    html += '</div>';
                    (a.fields || []).forEach(([label, text]) => {
                        html += label
                            ? `<p class="assignment-field"><strong>${label}:</strong> ${text}</p>`
                            : `<p class="assignment-field">${text}</p>`;
                    });
                    html += '</div>';
                });
                html += '</div>';
                html += '</div>';
            }

            // ============ POLICIES ============
            if (data.policies && data.policies.length > 0) {
                html += '<hr class="styled-hr">';
                html += '<div class="row" id="policies">';
                html += '<div class="col-left"><div class="section-label">POLICIES</div></div>';
                html += '<div class="col-right">';
                data.policies.forEach(p => {
                    html += `<div class="policy"><span class="policy-label">${p.label}.</span> ${p.html}</div>`;
                });
                html += '</div>';
                html += '</div>';
            }

            document.getElementById('course-container').innerHTML = html;

            // Anchor links (e.g. #short-paper) point at content rendered after load
            if (location.hash) {
                const target = document.getElementById(location.hash.slice(1));
                if (target) target.scrollIntoView();
            }
        }
    </script>
</body>
</html>
